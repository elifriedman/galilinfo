[project]
name = "galilinfo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "gowa>=0.1.0",
    "langchain-openai>=1.7.4",
    "openai>=3.49.0",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]
namespaces = true
